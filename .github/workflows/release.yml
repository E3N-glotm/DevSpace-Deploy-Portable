name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.1.14' }}
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart('v')
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore bundled runtime from latest stable Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = [version]$env:VERSION
          $releaseRows = gh release list `
            --repo "${{ github.repository }}" `
            --limit 100 `
            --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $previous = $releaseRows |
            Where-Object {
              $candidateTag = ([string]$_.tagName).TrimStart('v')
              if ($_.isDraft -or $_.isPrerelease -or $candidateTag -notmatch '^\d+\.\d+\.\d+$') {
                return $false
              }
              return ([version]$candidateTag) -lt $target
            } |
            Sort-Object { [version](([string]$_.tagName).TrimStart('v')) } -Descending |
            Select-Object -First 1
          if (-not $previous) {
            throw "No previous stable Release exists below v$env:VERSION."
          }
          $previousVersion = ([string]$previous.tagName).TrimStart('v')
          Write-Host "Using v$previousVersion as the canonical previous stable base for v$env:VERSION."
          $temporaryBase = Join-Path $env:RUNNER_TEMP "devspace-base-release.zip"
          $baseMeta = Join-Path $env:RUNNER_TEMP "devspace-base-release.json"
          ./scripts/hydrate-runtime-from-release.ps1 `
            -Version $previousVersion `
            -Repository "${{ github.repository }}" `
            -Force `
            -ArchiveOutput $temporaryBase `
            -MetadataOutput $baseMeta
          $metadata = Get-Content -LiteralPath $baseMeta -Raw | ConvertFrom-Json
          $namedBase = Join-Path $env:RUNNER_TEMP ("DevSpacePortable-Windows-x64-{0}.zip" -f $metadata.version)
          Move-Item -LiteralPath $temporaryBase -Destination $namedBase -Force
          $baseUpdateManifest = Join-Path $env:RUNNER_TEMP ("update-manifest-{0}.json" -f $metadata.version)
          gh release download ("v{0}" -f $metadata.version) `
            --repo "${{ github.repository }}" `
            --pattern "update-manifest.json" `
            --dir $env:RUNNER_TEMP `
            --clobber
          $downloadedManifest = Join-Path $env:RUNNER_TEMP "update-manifest.json"
          if (Test-Path -LiteralPath $downloadedManifest) {
            Move-Item -LiteralPath $downloadedManifest -Destination $baseUpdateManifest -Force
          } else {
            throw "Missing previous update-manifest.json for $($metadata.version)"
          }
          "BASE_VERSION=$($metadata.version)" >> $env:GITHUB_ENV
          "BASE_ZIP=$namedBase" >> $env:GITHUB_ENV
          "BASE_UPDATE_MANIFEST=$baseUpdateManifest" >> $env:GITHUB_ENV

      - name: Download legacy exact-delta migration bases
        if: ${{ steps.version.outputs.version == '1.1.40' || steps.version.outputs.version == '1.1.41' || steps.version.outputs.version == '1.1.42' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $migrationDir = Join-Path $env:RUNNER_TEMP "devspace-legacy-migration-bases"
          New-Item -ItemType Directory -Force -Path $migrationDir | Out-Null
          $baseVersions = @("1.1.32", "1.1.33", "1.1.34", "1.1.35", "1.1.36", "1.1.37", "1.1.38", "1.1.39")
          if ($env:VERSION -eq "1.1.42") {
            # The final 1.1.42 repack refreshes the requested direct matrix but
            # intentionally does not publish a 1.1.35 edge. 1.1.40 is fetched
            # here; 1.1.41 is already BASE_ZIP.
            $baseVersions = @($baseVersions | Where-Object { $_ -ne "1.1.35" })
            $baseVersions += "1.1.40"
          }
          foreach ($baseVersion in $baseVersions) {
            $baseName = "DevSpacePortable-Windows-x64-$baseVersion.zip"
            gh release download "v$baseVersion" `
              --repo "${{ github.repository }}" `
              --pattern $baseName `
              --dir $migrationDir `
              --clobber
            $baseZip = Join-Path $migrationDir $baseName
            if (-not (Test-Path -LiteralPath $baseZip)) {
              throw "Missing legacy exact-delta migration base: $baseZip"
            }
          }
          "MIGRATION_BASE_DIR=$migrationDir" >> $env:GITHUB_ENV

      - name: Download 1.1.42 blockmap bootstrap base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([version]$env:VERSION -le [version]"1.1.42") {
            Write-Host "Blockmap bootstrap base is only required after v1.1.42."
            exit 0
          }
          $bootstrapName = "DevSpacePortable-Windows-x64-1.1.42.zip"
          $bootstrapDir = Join-Path $env:RUNNER_TEMP "devspace-blockmap-bootstrap"
          New-Item -ItemType Directory -Force -Path $bootstrapDir | Out-Null
          gh release download "v1.1.42" `
            --repo "${{ github.repository }}" `
            --pattern $bootstrapName `
            --dir $bootstrapDir `
            --clobber
          $bootstrapZip = Join-Path $bootstrapDir $bootstrapName
          if (-not (Test-Path -LiteralPath $bootstrapZip)) {
            throw "Missing v1.1.42 blockmap bootstrap base: $bootstrapZip"
          }
          "BLOCKMAP_BOOTSTRAP_BASE=$bootstrapZip" >> $env:GITHUB_ENV

      - name: Verify tag and source version
        shell: pwsh
        run: |
          $manifest = Get-Content VERSION-MANIFEST.json -Raw | ConvertFrom-Json
          $actual = [string]$manifest.runtime.devspacePortable
          if ($actual -ne $env:VERSION) {
            throw "Tag version $env:VERSION does not match VERSION-MANIFEST portable version $actual"
          }
          $notes = "docs/releases/HOTFIX-$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }

      - name: Pack maintained core and install dependencies
        shell: pwsh
        run: |
          npm run core:pack
          npm ci --prefix app
          node setup/harden-nested-dependencies.mjs

      - name: Test source and Portable runtime
        shell: pwsh
        run: ./scripts/test-source.ps1 -SkipInstall -SkipAudit

      - name: Audit production dependencies
        run: npm audit --omit=dev --prefix app

      - name: Finalize metadata and build ZIP
        shell: pwsh
        run: |
          python setup/finalize-release.py $env:VERSION --hotfix "docs/releases/HOTFIX-$env:VERSION.md"
          python setup/build-release.py
          $targetZip = Join-Path $PWD "DevSpacePortable-Windows-x64-$env:VERSION.zip"
          $blockmap = Join-Path $PWD "DevSpacePortable-Windows-x64-$env:VERSION.blockmap"
          python setup/create-blockmap.py "$targetZip" "$blockmap"
          $incrementalZips = New-Object System.Collections.Generic.List[string]
          $rescueZip = $null

          if ($env:VERSION -eq "1.1.40" -or $env:VERSION -eq "1.1.41" -or $env:VERSION -eq "1.1.42") {
            # Legacy updaters only understand one exact
            # fromVersion -> latest edge. Keep direct legacy edges on the
            # migration/stability Releases so those installed clients do not
            # regress to a 500+ MiB full package while newer updaters use the
            # carry-forward graph.
            $migrationBaseVersions = @("1.1.32", "1.1.33", "1.1.34", "1.1.35", "1.1.36", "1.1.37", "1.1.38", "1.1.39")
            if ($env:VERSION -eq "1.1.42") {
              # Keep the requested 1.1.33-1.1.41 -> 1.1.42 direct matrix in
              # sync except for the explicitly omitted 1.1.35 edge.
              # 1.1.32 remains supported too.
              $migrationBaseVersions = @($migrationBaseVersions | Where-Object { $_ -ne "1.1.35" })
              $migrationBaseVersions += "1.1.40"
            }
            foreach ($baseVersion in $migrationBaseVersions) {
              $baseZip = Join-Path $env:MIGRATION_BASE_DIR "DevSpacePortable-Windows-x64-$baseVersion.zip"
              $deltaZip = Join-Path $PWD "DevSpacePortable-Update-$baseVersion-to-$env:VERSION.zip"
              python setup/create-incremental-update.py --base-zip "$baseZip" --target-zip "$targetZip" --output "$deltaZip"
              $incrementalZips.Add($deltaZip)
            }

            if ($env:VERSION -eq "1.1.41") {
              if ($env:BASE_VERSION -ne "1.1.40") {
                throw "1.1.41 release requires v1.1.40 as the previous stable base, received $env:BASE_VERSION"
              }
              $adjacentDeltaZip = Join-Path $PWD "DevSpacePortable-Update-1.1.40-to-1.1.41.zip"
              python setup/create-incremental-update.py --base-zip "$env:BASE_ZIP" --target-zip "$targetZip" --output "$adjacentDeltaZip"
              $incrementalZips.Add($adjacentDeltaZip)
            }

            if ($env:VERSION -eq "1.1.42") {
              if ($env:BASE_VERSION -ne "1.1.41") {
                throw "1.1.42 release requires v1.1.41 as the previous stable base, received $env:BASE_VERSION"
              }
              $adjacentDeltaZip = Join-Path $PWD "DevSpacePortable-Update-1.1.41-to-1.1.42.zip"
              python setup/create-incremental-update.py --base-zip "$env:BASE_ZIP" --target-zip "$targetZip" --output "$adjacentDeltaZip"
              $incrementalZips.Add($adjacentDeltaZip)
            }

            # Keep the historical 1.1.33 direct-extract rescue path for these
            # compatibility Releases because that installed updater had a known
            # apply-path failure mode before 1.1.36 hardened the transaction.
            $legacy113 = Join-Path $env:MIGRATION_BASE_DIR "DevSpacePortable-Windows-x64-1.1.33.zip"
            $rescueZip = Join-Path $PWD "DevSpacePortable-Rescue-1.1.33-to-$env:VERSION.zip"
            python setup/create-rescue-overlay.py --base-zip "$legacy113" --target-zip "$targetZip" --output "$rescueZip"
          } else {
            # v1.1.42 is the compatibility floor for block-pack-v2. Keep one
            # direct 1.1.42 -> current bridge on every later Release so an
            # installation made from an earlier 1.1.42 repack can still enter
            # the new engine. Blockmap-capable clients reconstruct the latest
            # target directly from the newest pack and reusable local chunks.
            if (-not $env:BLOCKMAP_BOOTSTRAP_BASE) {
              throw "BLOCKMAP_BOOTSTRAP_BASE is required for post-1.1.42 Releases."
            }
            $deltaZip = Join-Path $PWD "DevSpacePortable-Update-1.1.42-to-$env:VERSION.zip"
            python setup/create-incremental-update.py --base-zip "$env:BLOCKMAP_BOOTSTRAP_BASE" --target-zip "$targetZip" --output "$deltaZip"
            $incrementalZips.Add($deltaZip)
          }

          $manifestArgs = @("--repository", "${{ github.repository }}", "--zip", "$targetZip")
          $manifestArgs += @("--blockmap", "$blockmap")
          foreach ($deltaZip in $incrementalZips) { $manifestArgs += @("--incremental", "$deltaZip") }
          if ($rescueZip) { $manifestArgs += @("--rescue", "$rescueZip") }
          if ($env:VERSION -eq "1.1.41" -or $env:VERSION -eq "1.1.42") {
            $manifestArgs += @("--carry-forward-manifest", "$env:BASE_UPDATE_MANIFEST")
          }
          python setup/create-update-manifest.py @manifestArgs

      - name: Resolve GitHub Release files
        id: release_files
        shell: pwsh
        run: |
          $patterns = @(
            "DevSpacePortable-Windows-x64-$env:VERSION.zip",
            "DevSpacePortable-Update-*-to-$env:VERSION.zip",
            "DevSpacePortable-Windows-x64-$env:VERSION.blockmap",
            "release-assets/update-manifest.json",
            "release-assets/SHA256SUMS-release.txt"
          )
          if ($env:VERSION -in @("1.1.40", "1.1.41", "1.1.42")) {
            # Compatibility Releases intentionally carry the historical
            # direct-extract rescue overlay. Keep this pattern mandatory so a
            # missing rescue asset still fails the publish step.
            $patterns += "DevSpacePortable-Rescue-*-to-$env:VERSION.zip"
          }
          $delimiter = "DEVSPACE_RELEASE_FILES_$([guid]::NewGuid().ToString('N'))"
          "files<<$delimiter" >> $env:GITHUB_OUTPUT
          $patterns | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DevSpace Portable ${{ steps.version.outputs.version }}
          body_path: docs/releases/HOTFIX-${{ steps.version.outputs.version }}.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.release_files.outputs.files }}
