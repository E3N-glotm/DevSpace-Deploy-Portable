name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.1.14' }}
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart('v')
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore bundled runtime from latest stable Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $temporaryBase = Join-Path $env:RUNNER_TEMP "devspace-base-release.zip"
          $baseMeta = Join-Path $env:RUNNER_TEMP "devspace-base-release.json"
          ./scripts/hydrate-runtime-from-release.ps1 `
            -Repository "${{ github.repository }}" `
            -Force `
            -ArchiveOutput $temporaryBase `
            -MetadataOutput $baseMeta
          $metadata = Get-Content -LiteralPath $baseMeta -Raw | ConvertFrom-Json
          $namedBase = Join-Path $env:RUNNER_TEMP ("DevSpacePortable-Windows-x64-{0}.zip" -f $metadata.version)
          Move-Item -LiteralPath $temporaryBase -Destination $namedBase -Force
          $baseUpdateManifest = Join-Path $env:RUNNER_TEMP ("update-manifest-{0}.json" -f $metadata.version)
          gh release download ("v{0}" -f $metadata.version) `
            --repo "${{ github.repository }}" `
            --pattern "update-manifest.json" `
            --dir $env:RUNNER_TEMP `
            --clobber
          $downloadedManifest = Join-Path $env:RUNNER_TEMP "update-manifest.json"
          if (Test-Path -LiteralPath $downloadedManifest) {
            Move-Item -LiteralPath $downloadedManifest -Destination $baseUpdateManifest -Force
          } else {
            throw "Missing previous update-manifest.json for $($metadata.version)"
          }
          "BASE_VERSION=$($metadata.version)" >> $env:GITHUB_ENV
          "BASE_ZIP=$namedBase" >> $env:GITHUB_ENV
          "BASE_UPDATE_MANIFEST=$baseUpdateManifest" >> $env:GITHUB_ENV

      - name: Download legacy exact-delta migration bases
        if: ${{ steps.version.outputs.version == '1.1.40' || steps.version.outputs.version == '1.1.41' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $migrationDir = Join-Path $env:RUNNER_TEMP "devspace-legacy-migration-bases"
          New-Item -ItemType Directory -Force -Path $migrationDir | Out-Null
          foreach ($baseVersion in @("1.1.32", "1.1.33", "1.1.34", "1.1.35", "1.1.36", "1.1.37", "1.1.38", "1.1.39")) {
            $baseName = "DevSpacePortable-Windows-x64-$baseVersion.zip"
            gh release download "v$baseVersion" `
              --repo "${{ github.repository }}" `
              --pattern $baseName `
              --dir $migrationDir `
              --clobber
            $baseZip = Join-Path $migrationDir $baseName
            if (-not (Test-Path -LiteralPath $baseZip)) {
              throw "Missing legacy exact-delta migration base: $baseZip"
            }
          }
          "MIGRATION_BASE_DIR=$migrationDir" >> $env:GITHUB_ENV

      - name: Verify tag and source version
        shell: pwsh
        run: |
          $manifest = Get-Content VERSION-MANIFEST.json -Raw | ConvertFrom-Json
          $actual = [string]$manifest.runtime.devspacePortable
          if ($actual -ne $env:VERSION) {
            throw "Tag version $env:VERSION does not match VERSION-MANIFEST portable version $actual"
          }
          $notes = "docs/releases/HOTFIX-$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }

      - name: Pack maintained core and install dependencies
        shell: pwsh
        run: |
          npm run core:pack
          npm ci --prefix app
          node setup/harden-nested-dependencies.mjs

      - name: Test source and Portable runtime
        shell: pwsh
        run: ./scripts/test-source.ps1 -SkipInstall -SkipAudit

      - name: Audit production dependencies
        run: npm audit --omit=dev --prefix app

      - name: Finalize metadata and build ZIP
        shell: pwsh
        run: |
          python setup/finalize-release.py $env:VERSION --hotfix "docs/releases/HOTFIX-$env:VERSION.md"
          python setup/build-release.py
          $targetZip = Join-Path $PWD "DevSpacePortable-Windows-x64-$env:VERSION.zip"
          $incrementalZips = New-Object System.Collections.Generic.List[string]
          $rescueZip = $null

          if ($env:VERSION -eq "1.1.40" -or $env:VERSION -eq "1.1.41") {
            # 1.1.32-1.1.39 updaters only understand one exact
            # fromVersion -> latest edge. 1.1.40 was the migration checkpoint;
            # 1.1.41 is the stable follow-up and must preserve that compatibility
            # while also publishing the normal 1.1.40 -> 1.1.41 adjacent edge.
            foreach ($baseVersion in @("1.1.32", "1.1.33", "1.1.34", "1.1.35", "1.1.36", "1.1.37", "1.1.38", "1.1.39")) {
              $baseZip = Join-Path $env:MIGRATION_BASE_DIR "DevSpacePortable-Windows-x64-$baseVersion.zip"
              $deltaZip = Join-Path $PWD "DevSpacePortable-Update-$baseVersion-to-$env:VERSION.zip"
              python setup/create-incremental-update.py --base-zip "$baseZip" --target-zip "$targetZip" --output "$deltaZip"
              $incrementalZips.Add($deltaZip)
            }

            if ($env:VERSION -eq "1.1.41") {
              if ($env:BASE_VERSION -ne "1.1.40") {
                throw "1.1.41 release requires v1.1.40 as the previous stable base, received $env:BASE_VERSION"
              }
              $adjacentDeltaZip = Join-Path $PWD "DevSpacePortable-Update-1.1.40-to-1.1.41.zip"
              python setup/create-incremental-update.py --base-zip "$env:BASE_ZIP" --target-zip "$targetZip" --output "$adjacentDeltaZip"
              $incrementalZips.Add($adjacentDeltaZip)
            }

            # Keep the historical 1.1.33 direct-extract rescue path for this
            # compatibility Release because that installed updater had a known
            # apply-path failure mode before 1.1.36 hardened the transaction.
            $legacy113 = Join-Path $env:MIGRATION_BASE_DIR "DevSpacePortable-Windows-x64-1.1.33.zip"
            $rescueZip = Join-Path $PWD "DevSpacePortable-Rescue-1.1.33-to-$env:VERSION.zip"
            python setup/create-rescue-overlay.py --base-zip "$legacy113" --target-zip "$targetZip" --output "$rescueZip"
          } else {
            # After the 1.1.41 stable compatibility Release, each Release
            # carries only its previous -> current edge. The 1.1.40+ updater
            # composes these historical Release edges into one transactional
            # incremental chain.
            $deltaZip = Join-Path $PWD "DevSpacePortable-Update-$env:BASE_VERSION-to-$env:VERSION.zip"
            python setup/create-incremental-update.py --base-zip "$env:BASE_ZIP" --target-zip "$targetZip" --output "$deltaZip"
            $incrementalZips.Add($deltaZip)
          }

          $manifestArgs = @("--repository", "${{ github.repository }}", "--zip", "$targetZip")
          foreach ($deltaZip in $incrementalZips) { $manifestArgs += @("--incremental", "$deltaZip") }
          if ($rescueZip) { $manifestArgs += @("--rescue", "$rescueZip") }
          if ($env:VERSION -ne "1.1.40") { $manifestArgs += @("--carry-forward-manifest", "$env:BASE_UPDATE_MANIFEST") }
          python setup/create-update-manifest.py @manifestArgs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DevSpace Portable ${{ steps.version.outputs.version }}
          body_path: docs/releases/HOTFIX-${{ steps.version.outputs.version }}.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            DevSpacePortable-Windows-x64-${{ steps.version.outputs.version }}.zip
            DevSpacePortable-Update-*-to-${{ steps.version.outputs.version }}.zip
            DevSpacePortable-Rescue-*-to-${{ steps.version.outputs.version }}.zip
            release-assets/update-manifest.json
            release-assets/SHA256SUMS-release.txt

