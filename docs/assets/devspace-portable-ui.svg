<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DevSpace Portable 控制中心示意图</title>
  <desc id="desc">使用虚构示意数据绘制的 DevSpace Portable 原生控制中心，不包含真实域名、Token、用户名或本机路径。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#203058" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; fill: #182033; }
      .muted { fill: #6d7895; }
      .mono { font-family: "Cascadia Code", "Consolas", monospace; }
      .nav { font-size: 18px; font-weight: 650; }
      .label { font-size: 16px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f6f8fc"/>
  <rect x="20" y="18" width="1560" height="864" rx="22" fill="#ffffff" stroke="#d9e1ef" filter="url(#shadow)"/>
  <rect x="42" y="42" width="1516" height="96" rx="24" fill="#ffffff" stroke="#d9e1ef"/>
  <rect x="68" y="66" width="50" height="50" rx="14" fill="#495bf6"/>
  <text x="93" y="100" text-anchor="middle" class="ui" font-size="31" font-weight="700" fill="#ffffff">D</text>
  <text x="138" y="88" class="ui" font-size="28" font-weight="700">DevSpace Portable</text>
  <text x="138" y="113" class="ui muted" font-size="15">配置与权限</text>
  <text x="1390" y="95" class="ui" font-size="16">Computer Use</text>
  <rect x="1500" y="75" width="38" height="22" rx="11" fill="#495bf6"/>
  <circle cx="1527" cy="86" r="8" fill="#ffffff"/>

  <rect x="42" y="158" width="220" height="694" rx="24" fill="#ffffff" stroke="#d9e1ef"/>
  <rect x="58" y="180" width="188" height="58" rx="16" fill="#495bf6"/>
  <text x="86" y="205" class="ui" font-size="18" font-weight="700" fill="#ffffff">⌂</text>
  <text x="118" y="205" class="ui" font-size="18" font-weight="700" fill="#ffffff">状态与部署</text>
  <text x="118" y="226" class="ui" font-size="12" fill="#e9ecff">OVERVIEW</text>
  <g class="ui nav">
    <text x="76" y="292" fill="#6172ff">⊙</text><text x="112" y="292">配置与权限</text>
    <text x="76" y="366" fill="#6172ff">▦</text><text x="112" y="366">插件管理</text>
    <text x="76" y="440" fill="#6172ff">◷</text><text x="112" y="440">会话与回退</text>
    <text x="76" y="514" fill="#6172ff">▤</text><text x="112" y="514">显式 Memories</text>
    <text x="76" y="588" fill="#6172ff">⌁</text><text x="112" y="588">日志与诊断</text>
  </g>

  <rect x="284" y="158" width="1274" height="694" rx="24" fill="#f7f9fc" stroke="#d9e1ef"/>
  <text x="316" y="202" class="ui" font-size="24" font-weight="700">公网与本地服务</text>
  <text x="316" y="228" class="ui muted" font-size="14">以下内容为文档示意值，不对应任何真实账号或部署。</text>
  <rect x="316" y="252" width="586" height="390" rx="20" fill="#ffffff" stroke="#d9e1ef"/>
  <rect x="926" y="252" width="600" height="390" rx="20" fill="#ffffff" stroke="#d9e1ef"/>
  <text x="344" y="290" class="ui" font-size="19" font-weight="700">隧道与服务</text>
  <text x="954" y="290" class="ui" font-size="19" font-weight="700">目录、权限和功能</text>

  <g class="ui label">
    <text x="344" y="334">隧道提供商</text>
    <text x="344" y="395">公网 HTTPS 根地址</text>
    <text x="344" y="456">本地端口</text>
    <text x="344" y="517">ngrok Authtoken</text>
    <text x="344" y="578">ngrok 出站代理</text>
  </g>
  <g>
    <rect x="548" y="307" width="322" height="40" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
    <text x="568" y="333" class="ui">ngrok</text>
    <rect x="548" y="368" width="322" height="40" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
    <text x="568" y="394" class="ui muted">https://your-domain.example</text>
    <rect x="548" y="429" width="322" height="40" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
    <text x="568" y="455" class="ui">7676</text>
    <rect x="548" y="490" width="322" height="40" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
    <text x="568" y="516" class="ui muted">••••••••••••••••</text>
    <rect x="548" y="551" width="322" height="40" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
    <text x="568" y="577" class="ui muted">可选：本地代理地址</text>
  </g>

  <g class="ui label">
    <text x="954" y="334">访问权限</text>
    <text x="954" y="395">允许的工作目录</text>
    <text x="954" y="500">功能</text>
  </g>
  <rect x="1160" y="307" width="330" height="40" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
  <text x="1180" y="333" class="ui">workspace</text>
  <rect x="1160" y="368" width="330" height="98" rx="10" fill="#f7f9fc" stroke="#d2daeb"/>
  <text x="1180" y="399" class="ui muted mono" font-size="14">C:\Projects\ExampleProject</text>
  <text x="1180" y="427" class="ui muted mono" font-size="14">D:\Workspace\AnotherProject</text>
  <g class="ui" font-size="15">
    <rect x="1160" y="486" width="18" height="18" rx="4" fill="#495bf6"/><text x="1188" y="501">Computer Use</text>
    <rect x="1320" y="486" width="18" height="18" rx="4" fill="#495bf6"/><text x="1348" y="501">Memories</text>
    <rect x="1160" y="526" width="18" height="18" rx="4" fill="#495bf6"/><text x="1188" y="541">会话修改统计与回退</text>
    <rect x="1320" y="526" width="18" height="18" rx="4" fill="#ffffff" stroke="#c9d2e5"/><text x="1348" y="541">Hooks</text>
  </g>

  <rect x="316" y="674" width="154" height="48" rx="14" fill="#495bf6"/>
  <text x="393" y="705" text-anchor="middle" class="ui" font-size="16" font-weight="700" fill="#ffffff">保存并自动部署</text>
  <rect x="484" y="674" width="130" height="48" rx="14" fill="#ffffff" stroke="#ccd6ea"/>
  <text x="549" y="705" text-anchor="middle" class="ui" font-size="16">启动服务</text>
  <rect x="628" y="674" width="130" height="48" rx="14" fill="#ffffff" stroke="#ccd6ea"/>
  <text x="693" y="705" text-anchor="middle" class="ui" font-size="16">验证 HTTP</text>
  <rect x="772" y="674" width="130" height="48" rx="14" fill="#ffffff" stroke="#ccd6ea"/>
  <text x="837" y="705" text-anchor="middle" class="ui" font-size="16">诊断隧道</text>
  <rect x="316" y="750" width="1210" height="70" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
  <circle cx="344" cy="785" r="6" fill="#18a477"/>
  <text x="364" y="781" class="ui" font-size="16" font-weight="700">示意状态：服务已就绪</text>
  <text x="364" y="806" class="ui muted" font-size="14">实际部署时请以“验证 HTTP”和“诊断隧道”的结果为准。</text>
  <text x="44" y="876" class="ui muted" font-size="13">DevSpace Portable · documentation mockup · no real credentials or domains</text>
</svg>
